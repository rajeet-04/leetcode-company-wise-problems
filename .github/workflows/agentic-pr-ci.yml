name: Agentic Phase PR CI

on:
  pull_request:
    branches:
      - docs/agentic-roadmap

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Normalize workspace lockfile
        run: bun install
      - name: Commit normalized lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh workspace lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Shared tests
        run: bun run test
      - name: Validate Catalog V2
        if: ${{ hashFiles('frontend/src/data/catalog-v2.json') != '' }}
        run: bun packages/catalog/src/validate-cli.ts
      - name: Generate Next route types
        working-directory: frontend
        run: bunx next typegen
      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      - name: Extension tests
        if: ${{ hashFiles('extension/package.json') != '' }}
        working-directory: extension
        run: bun run test
      - name: Extension build
        if: ${{ hashFiles('extension/package.json') != '' }}
        working-directory: extension
        run: bun run build
