name: Regenerate canonical brand icons

on:
  push:
    branches: [fix/chrome-web-store-readiness]
    paths:
      - ".github/workflows/regenerate-brand-icons.yml"
      - "frontend/scripts/generate-brand-icons.ts"
      - "frontend/public/leet-progress-mark.png"
      - "frontend/package.json"
      - "package.json"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/chrome-web-store-readiness
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace
        run: bun install
      - name: Generate canonical icon set
        run: cd frontend && bun run brand:icons
      - name: Commit generated icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- extension/icons/icon-16.png extension/icons/icon-32.png extension/icons/icon-48.png extension/icons/icon-128.png frontend/public/leet-progress-icon.png frontend/app/icon.png bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate canonical Leet Progress icons"
            git push origin HEAD:fix/chrome-web-store-readiness
          fi
