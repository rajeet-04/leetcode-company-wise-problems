name: Phase 00 Foundation CI

on:
  push:
    branches:
      - feat/phase-00-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feat/phase-00-foundation

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run verification and persist result
        shell: bash
        run: |
          set +e
          mkdir -p docs/agentic/implementation
          : > /tmp/phase00-results.txt
          overall=0

          run_check() {
            label="$1"
            shift
            "$@" > /tmp/phase00-command.log 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "- PASS: $label" >> /tmp/phase00-results.txt
            else
              echo "- FAIL($code): $label" >> /tmp/phase00-results.txt
              echo "" >> /tmp/phase00-results.txt
              echo "  Last output:" >> /tmp/phase00-results.txt
              tail -n 30 /tmp/phase00-command.log | sed 's/^/    /' >> /tmp/phase00-results.txt
              echo "" >> /tmp/phase00-results.txt
              overall=$code
            fi
          }

          cd frontend
          run_check "frontend frozen install" bun install --frozen-lockfile
          run_check "Next route type generation" bunx next typegen
          run_check "frontend typecheck" bun run typecheck
          run_check "frontend production build" bun run build
          cd ..

          if [ -f package.json ]; then
            run_check "root workspace install" bun install
          fi

          if [ -f vitest.config.ts ]; then
            run_check "shared Vitest suite" bun run test
          fi

          cat > docs/agentic/implementation/CI_STATUS.md <<EOF
          # Phase 00 CI checkpoint

          Verified source commit: ${GITHUB_SHA}

          $(cat /tmp/phase00-results.txt)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agentic/implementation/CI_STATUS.md
          if [ -f bun.lock ]; then git add bun.lock; fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: record phase 00 verification"
            git push origin HEAD:feat/phase-00-foundation
          fi

          exit "$overall"
